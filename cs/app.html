<script>
(function () {
  // ?src=ig_bio | ig_story | ig_dm | email | wa | coach | qr ... (defaults to "direct")
  var qs = new URLSearchParams(location.search);
  var src = (qs.get('src') || qs.get('utm_source') || 'direct').replace(/[^a-z0-9_\-]/gi, '').slice(0, 40) || 'direct';

  var IOS = 'https://apps.apple.com/cz/app/elite-hockey-drills/id6787257275?ct=' + encodeURIComponent(src);
  var ANDROID = 'https://play.google.com/store/apps/details?id=com.elitehockeydrills.training&hl=cs&referrer=' +
    encodeURIComponent('utm_source=' + src + '&utm_medium=smartlink&utm_campaign=app');

  document.getElementById('ios').href = IOS;
  document.getElementById('android').href = ANDROID;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var target = isAndroid ? ANDROID : (isIOS ? IOS : null);
  var platform = isAndroid ? 'android' : (isIOS ? 'ios' : 'desktop');

  function track(name, cb) {
    var done = false;
    function go() { if (!done) { done = true; cb && cb(); } }
    try {
      gtag('event', name, { platform: platform, link_source: src, event_callback: go, event_timeout: 700 });
    } catch (e) {}
    setTimeout(go, 800);
  }

  // Count manual taps too (desktop, or if auto-redirect is blocked)
  ['ios', 'android'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function () {
      try { gtag('event', 'store_click', { platform: id, link_source: src }); } catch (e) {}
    });
  });

  if (target) {
    document.getElementById('status').textContent = 'Otevírám ' + (isAndroid ? 'Google Play' : 'App Store') + '…';
    track('store_redirect', function () { location.replace(target); });
  } else {
    track('smartlink_desktop');
  }
})();
</script>
